[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-irrigation-engine"
version = "0.2.0"
description = "A modular open-source irrigation framework for Home Assistant"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Lead Architect", email = "architect@example.com" }
]
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
